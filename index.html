<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prize Roulette</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="roulette-stage" aria-label="&#49345;&#54408; &#47344;&#47131;">
        <div class="wheel-wrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="900" height="900" aria-label="&#47344;&#47131; &#54032;"></canvas>
          <button id="spinButton" class="spin-button" type="button">&#46028;&#47532;&#44592;</button>
        </div>
        <div class="result-panel" aria-live="polite">
          <span class="label">&#50724;&#45720;&#51032; &#49345;&#54408;</span>
          <strong id="resultText">&#47344;&#47131;&#51012; &#46028;&#47140;&#51452;&#49464;&#50836;</strong>
        </div>
      </section>

      <section class="controls" aria-label="&#47344;&#47131; &#49444;&#51221;">
        <header>
          <p>Prize Roulette</p>
          <h1>&#49345;&#54408;&#44284; &#45817;&#52392; &#54869;&#47456;</h1>
        </header>

        <div class="prize-editor">
          <div class="editor-head" aria-hidden="true">
            <span>&#49345;&#54408;</span>
            <span>&#54869;&#47456;</span>
            <span></span>
          </div>
          <div id="prizeRows" class="prize-rows"></div>
        </div>

        <div class="summary" aria-live="polite">
          <span>&#51204;&#52404; &#54869;&#47456;</span>
          <strong id="totalPercent">100%</strong>
        </div>

        <div class="actions">
          <button id="addButton" type="button">&#49345;&#54408; &#52628;&#44032;</button>
          <button id="shuffleButton" type="button">&#49438;&#44592;</button>
          <button id="resetButton" type="button">&#52488;&#44592;&#54868;</button>
        </div>

        <section class="history" aria-label="&#52572;&#44540; &#44208;&#44284;">
          <h2>&#52572;&#44540; &#44208;&#44284;</h2>
          <ol id="historyList"></ol>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
